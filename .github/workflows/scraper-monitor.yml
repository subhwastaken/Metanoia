name: ScrapeGuard — Autonomous Scraper Monitor

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual triggering from GitHub console

jobs:
  monitor:
    name: Run Scrapers and Self-Heal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate Bright Data CLI
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_CUSTOMER_ID: ${{ secrets.BRIGHTDATA_CUSTOMER_ID }}
        run: |
          if [ -n "$BRIGHTDATA_API_KEY" ]; then
            npx -p @brightdata/cli brightdata login --api-key "$BRIGHTDATA_API_KEY" --customer "$BRIGHTDATA_CUSTOMER_ID"
            echo "Authenticated with Bright Data."
          else
            echo "No credentials set. Running in simulation mode."
          fi

      - name: Run ScrapeGuard Monitor
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          MOCK_BRIGHTDATA: ${{ secrets.MOCK_BRIGHTDATA || 'true' }}
        run: |
          python scripts/monitor.py --config scrapers.json
